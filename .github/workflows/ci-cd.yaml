name: Build and Deploy GitOps Labs

on:
  push:
    branches:
      - dev
      - staging
      - main
    paths:
      - 'app/**'
      - 'app.py'
      - 'requirements.txt'
      - 'tests/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/ci-cd.yaml'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment and image tag
        id: vars
        shell: bash
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          SHA="${GITHUB_SHA::12}"

          if [ "$BRANCH" = "main" ]; then
            echo "ENV=production" >> "$GITHUB_OUTPUT"
            echo "TAG=prod-${SHA}" >> "$GITHUB_OUTPUT"
            echo "MANIFEST=k8s/overlays/production/kustomization.yaml" >> "$GITHUB_OUTPUT"

          elif [ "$BRANCH" = "staging" ]; then
            echo "ENV=staging" >> "$GITHUB_OUTPUT"
            echo "TAG=staging-${SHA}" >> "$GITHUB_OUTPUT"
            echo "MANIFEST=k8s/overlays/staging/kustomization.yaml" >> "$GITHUB_OUTPUT"

          elif [ "$BRANCH" = "dev" ]; then
            echo "ENV=dev" >> "$GITHUB_OUTPUT"
            echo "TAG=dev-${SHA}" >> "$GITHUB_OUTPUT"
            echo "MANIFEST=k8s/overlays/dev/kustomization.yaml" >> "$GITHUB_OUTPUT"

          else
            echo "Unsupported branch: $BRANCH"
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/gitops-labs:${{ steps.vars.outputs.TAG }}

      - name: Update image tag
        env:
          MANIFEST: ${{ steps.vars.outputs.MANIFEST }}
          TAG: ${{ steps.vars.outputs.TAG }}
        shell: bash
        run: |
          test -f "$MANIFEST" || {
            echo "Manifest not found: $MANIFEST"
            exit 1
          }

          sed -i -E \
            "s/^([[:space:]]*newTag:).*/\1 ${TAG}/" \
            "$MANIFEST"

          echo "Updated image:"
          grep -A 3 'images:' "$MANIFEST"

      - name: Commit and push updated manifest
        env:
          MANIFEST: ${{ steps.vars.outputs.MANIFEST }}
          ENVIRONMENT: ${{ steps.vars.outputs.ENV }}
          TAG: ${{ steps.vars.outputs.TAG }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$MANIFEST"

          if git diff --cached --quiet; then
            echo "No manifest changes to commit."
            exit 0
          fi

          git commit -m "ci(${ENVIRONMENT}): update image tag to ${TAG}"

          git push origin "HEAD:${GITHUB_REF_NAME}"
