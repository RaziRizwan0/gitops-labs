apiVersion: apps/v1
kind: Deployment

metadata:
  name: gitops-labs
  labels:
    app.kubernetes.io/name: gitops-labs

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: gitops-labs

  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitops-labs

    spec:
      # Run the application as a non-root user.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: web
          image: gitops-labs:bootstrap
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            - name: DATABASE_PATH
              value: /data/names.db

          # Health checks
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3

          # CPU and memory limits
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi

          # Container security
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          # Persistent application data and writable temporary storage
          volumeMounts:
            - name: data
              mountPath: /data

            - name: tmp
              mountPath: /tmp

      # Volumes
      volumes:
        # Persistent storage for the application database
        - name: data
          persistentVolumeClaim:
            claimName: gitops-labs-data

        # Writable temporary directory for Gunicorn and Python
        - name: tmp
          emptyDir: {}
