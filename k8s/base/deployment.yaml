apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-labs
  labels: {app.kubernetes.io/name: gitops-labs}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: gitops-labs}
  template:
    metadata:
      labels: {app.kubernetes.io/name: gitops-labs}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: gitops-labs:bootstrap
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          env: [{name: DATABASE_PATH, value: /data/names.db}]
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 15, periodSeconds: 20}
          resources:
            requests: {cpu: 100m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: gitops-labs-data}}]
